[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "badgemagic-ble"
version = "0.1.0"
description = "Bluetooth LE client for LED badges running the FOSSASIA Badge Magic firmware"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["badgemagic", "led badge", "bluetooth", "ble", "fossasia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.22",
    "bleak-retry-connector>=3.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
badgemagic = "badgemagic_ble.cli:main"

[project.urls]
Source = "https://github.com/romkey/hass-badgemagic/tree/main/badgemagic-ble"
Issues = "https://github.com/romkey/hass-badgemagic/issues"
Firmware = "https://github.com/fossasia/badgemagic-firmware"

[tool.hatch.build.targets.wheel]
packages = ["src/badgemagic_ble"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
