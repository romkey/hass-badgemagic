name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundled-library:
    name: Bundled library matches badgemagic-ble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 scripts/sync_library.py --check

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          uv venv
          # The integration uses its bundled copy of the library, so the
          # library itself is not installed.
          uv pip install -r requirements_test.txt
      - name: Run tests
        run: uv run --no-project python -m pytest -q
