name: Publish library to PyPI

# Push a tag such as badgemagic-ble-v0.1.0 (matching "version" in
# badgemagic-ble/pyproject.toml). Uses PyPI trusted publishing: configure this
# repository, this workflow file and the "pypi" environment as a trusted
# publisher for the badgemagic-ble project on pypi.org first.
on:
  push:
    tags:
      - "badgemagic-ble-v*"

defaults:
  run:
    working-directory: badgemagic-ble

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Check the tag matches pyproject.toml
        run: |
          version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "badgemagic-ble-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi
      - run: uv venv && uv pip install -e ".[dev]" && uv run --no-project python -m pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: badgemagic-ble/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
